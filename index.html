<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomodoro</title>
<style>
  :root {
    --bg: #10131a; --fg: #e8ecf4; --dim: #7d879c;
    --accent: #ff6b5b;          /* focus */
    --accent-break: #45c9a5;    /* break */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #1b2130 0%, var(--bg) 60%);
    color: var(--fg); font: 400 16px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    transition: background .6s;
  }
  main { text-align: center; padding: 24px; }
  .phase {
    letter-spacing: .35em; text-transform: uppercase; font-size: 13px;
    color: var(--dim); margin-bottom: 20px;
  }
  .dial { position: relative; width: min(76vw, 340px); aspect-ratio: 1; margin: 0 auto; }
  svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  circle { fill: none; stroke-linecap: round; }
  .track { stroke: #ffffff14; stroke-width: 6; }
  .prog  { stroke: var(--accent); stroke-width: 10; transition: stroke .6s; filter: drop-shadow(0 0 12px var(--accent)); }
  .time {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: clamp(48px, 15vw, 76px); font-weight: 300; font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  .controls { margin-top: 28px; display: flex; gap: 12px; justify-content: center; }
  button {
    font: inherit; color: var(--fg); background: #ffffff10; border: 1px solid #ffffff1a;
    padding: 11px 26px; border-radius: 999px; cursor: pointer; transition: background .15s, transform .1s;
  }
  button:hover { background: #ffffff1c; }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); border-color: transparent; color: #12151c; font-weight: 600; min-width: 128px; }
  .dots { margin-top: 22px; display: flex; gap: 9px; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ffffff20; transition: background .3s; }
  .dot.on { background: var(--accent); }
  .hint { margin-top: 20px; font-size: 12px; color: var(--dim); }
  body.break { --accent: var(--accent-break); }

  details { margin-top: 18px; font-size: 13px; color: var(--dim); }
  summary { cursor: pointer; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
  summary::-webkit-details-marker { display: none; }
  .settings { display: grid; gap: 10px; margin-top: 16px; }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .settings input {
    font: inherit; width: 72px; text-align: center; color: var(--fg);
    background: #ffffff10; border: 1px solid #ffffff1a; border-radius: 8px; padding: 6px 4px;
  }
  .settings input:focus { outline: 1px solid var(--accent); }
</style>

<main>
  <div class="phase" id="phase">Focus</div>

  <div class="dial">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="45"></circle>
      <circle class="prog"  cx="50" cy="50" r="45" id="prog"
              stroke-dasharray="282.74" stroke-dashoffset="0"></circle>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>

  <div class="controls">
    <button class="primary" id="toggle">Start</button>
    <button id="reset">Reset</button>
    <button id="skip">Skip</button>
  </div>

  <div class="dots" id="dots"></div>
  <div class="hint">space — start / pause &nbsp;·&nbsp; r — reset</div>

  <details>
    <summary>Settings</summary>
    <div class="settings">
      <label>Focus <input type="number" id="s-focus"  min="1" max="180" step="1"></label>
      <label>Short break <input type="number" id="s-short"  min="1" max="180" step="1"></label>
      <label>Long break <input type="number" id="s-long"   min="1" max="180" step="1"></label>
      <label>Rounds <input type="number" id="s-rounds" min="1" max="12"  step="1"></label>
    </div>
  </details>
</main>

<script>
const MIN = 60;
const LABELS = { focus: "Focus", short: "Short break", long: "Long break" };

// minutes per phase + focus blocks before a long break
const cfg = { focus: 25, short: 5, long: 15, rounds: 4 };
Object.assign(cfg, JSON.parse(localStorage.pomodoro || "{}"));

const secs = p => cfg[p] * MIN;

let phase = "focus";
let done = 0;              // completed focus blocks in this set
let remaining = secs(phase);
let deadline = null;       // ms timestamp; null when paused

const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 45;

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// which phase follows the current one
const nextPhase = (cur, completed, rounds = cfg.rounds) =>
  cur !== "focus" ? "focus" : (completed % rounds === 0 ? "long" : "short");

function render() {
  const total = secs(phase);
  const left = Math.max(0, remaining);
  $("time").textContent = fmt(Math.ceil(left));
  $("phase").textContent = LABELS[phase];
  $("prog").style.strokeDashoffset = CIRC * (1 - left / total);
  $("toggle").textContent = deadline ? "Pause" : (left < total ? "Resume" : "Start");
  document.body.classList.toggle("break", phase !== "focus");
  document.title = `${fmt(Math.ceil(left))} · ${LABELS[phase]}`;
  $("dots").innerHTML = Array.from({ length: cfg.rounds },
    (_, i) => `<div class="dot ${i < done % cfg.rounds || (done && done % cfg.rounds === 0) ? "on" : ""}"></div>`).join("");
}

// ponytail: deadline-based, not a decrementing counter — setInterval drifts and
// background tabs get throttled to 1Hz or worse.
function tick() {
  if (deadline) {
    remaining = (deadline - performance.now()) / 1000;
    if (remaining <= 0) advance();
  }
  render();
  requestAnimationFrame(tick);
}

function advance() {
  chime(phase === "focus");
  if (phase === "focus") done++;
  phase = nextPhase(phase, done);
  remaining = secs(phase);
  deadline = performance.now() + remaining * 1000;  // auto-continue
}

function toggle() {
  if (deadline) { remaining = (deadline - performance.now()) / 1000; deadline = null; }
  else { deadline = performance.now() + remaining * 1000; blip(); }
}

function reset() { deadline = null; remaining = secs(phase); }

function skip() {
  if (phase === "focus") done++;
  phase = nextPhase(phase, done);
  remaining = secs(phase);
  if (deadline) deadline = performance.now() + remaining * 1000;
}

// ponytail: synthesised tones, no audio files to host or preload.
let ac;
function tone(freq, at, dur, gain = 0.22) {
  ac ||= new AudioContext();
  const t = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur);
}
const blip  = () => tone(880, 0, 0.12, 0.1);
// rising triad ending focus, falling one ending a break
const chime = up => [0, .16, .32].forEach((d, i) =>
  tone((up ? [523, 659, 784] : [784, 659, 523])[i], d, 1.1));

// Settings. `min`/`max` on the inputs only guard the spinners — a typed value
// still needs clamping before it reaches the timer.
const LIMITS = { focus: 180, short: 180, long: 180, rounds: 12 };
const clamp = (n, max) => Math.min(Math.max(Math.round(n), 1), max);

for (const key of Object.keys(cfg)) {
  const input = $("s-" + key);
  input.value = cfg[key];
  input.onchange = () => {
    const n = Number(input.value);
    if (!Number.isFinite(n) || input.value === "") return void (input.value = cfg[key]);  // blank / junk: revert
    cfg[key] = input.value = clamp(n, LIMITS[key]);
    localStorage.pomodoro = JSON.stringify(cfg);
    if (key === phase) reset();   // retime the phase you're sitting in
  };
}

$("toggle").onclick = toggle;
$("reset").onclick = reset;
$("skip").onclick = skip;
onkeydown = e => {
  if (e.target.tagName === "INPUT") return;   // typing in settings, not driving the clock
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.key === "r") reset();
};

render();
tick();

// ponytail: one self-check for the only non-obvious logic. Open index.html#test
if (location.hash === "#test") {
  console.assert(fmt(1500) === "25:00", "fmt 1500");
  console.assert(fmt(59) === "0:59", "fmt 59");
  console.assert(fmt(0) === "0:00", "fmt 0");
  console.assert(nextPhase("focus", 1, 4) === "short", "1st focus -> short");
  console.assert(nextPhase("focus", 4, 4) === "long", "4th focus -> long");
  console.assert(nextPhase("focus", 2, 2) === "long", "rounds=2 honoured");
  console.assert(nextPhase("short", 1, 4) === "focus", "break -> focus");
  console.assert(nextPhase("long", 4, 4) === "focus", "long -> focus");

  console.assert(clamp(0, 180) === 1, "0 clamps up to 1");
  console.assert(clamp(-5, 180) === 1, "negative clamps up to 1");
  console.assert(clamp(999, 180) === 180, "over max clamps down");
  console.assert(clamp(25.6, 180) === 26, "fractional rounds");
  console.log("self-check done");
}
</script>
