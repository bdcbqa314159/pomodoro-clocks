name: ci

# macOS only, deliberately. Linux and Windows are a later problem: the C++ side
# needs its FTXUI build proven there and the Rust side needs eframe's system
# dev packages pinned. Re-enable by putting the matrix back:
#   strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
#   runs-on: ${{ matrix.os }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build wasm target
        run: cargo build --release --target wasm32-unknown-unknown

  format:
    runs-on: macos-latest
    continue-on-error: true  # advisory until the tree is normalised
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: clang-format --dry-run -Werror $(git ls-files '*.hpp' '*.cpp')
